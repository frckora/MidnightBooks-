<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">
  <meta name="theme-color" content="#160D11">
  <title>MidnightBooks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #160D11;
      --black: #0D080B;
      --soft: #211117;
      --card: rgba(45,25,32,.92);
      --dark: rgba(29,16,21,.96);
      --silver: #E7E5E5;
      --silver2: #C9C7C8;
      --muted: #A19B9E;
      --silver-dark: #777074;
      --wine: #641E2A;
      --wine2: #84303E;
      --wine-dark: #3B111A;
      --glow: #3A1B24;
      --safe: env(safe-area-inset-bottom);
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--silver);
      font-family: Georgia,
                   "Times New Roman",
                   serif;
    }
    body {
      background:
        radial-gradient(
          ellipse at 50% -10%,
          rgba(100,30,42,.42),
          transparent 48%
        ),
        radial-gradient(
          ellipse at 0% 50%,
          rgba(58,27,36,.55),
          transparent 45%
        ),
        #160D11;
      padding-bottom: calc(84px + var(--safe));
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button {
      color: inherit;
      cursor: pointer;
      transition: all .2s ease;
    }
    button:active {
      transform: scale(.96);
    }
    .app {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 100px;
    }
    .header {
      padding: 8px 2px 16px;
    }
    .brand {
      text-align: center;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(32px, 9vw, 52px);
      letter-spacing: .13em;
      color: var(--silver);
      text-shadow: 0 0 18px rgba(231,229,229,.18);
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .brand h1:active {
      transform: scale(.98);
    }
    .brand-line {
      height: 1px;
      margin: 10px auto 15px;
      max-width: 360px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--wine2),
        transparent
      );
    }
    .header-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn,
    .icon-btn,
    .seg button,
    .sort select {
      border: 1px solid rgba(201,199,200,.2);
      background: rgba(13,8,11,.58);
      border-radius: 12px;
      padding: 10px 13px;
      cursor: pointer;
      transition: all .25s ease;
      backdrop-filter: blur(8px);
      font-family: Arial,
                   sans-serif;
    }
    .btn {
      text-transform: uppercase;
      letter-spacing: .1em;
      font-size: 11px;
    }
    .btn.primary {
      background: linear-gradient(
        135deg,
        var(--wine2),
        var(--wine-dark)
      );
      border-color: rgba(201,199,200,.25);
    }
    .btn.primary:hover {
      background: linear-gradient(
        135deg,
        var(--wine),
        var(--wine2)
      );
      border-color: rgba(201,199,200,.5);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(132,48,62,.3);
    }
    .btn.primary:active {
      transform: scale(.95);
    }
    .btn:hover {
      border-color: rgba(201,199,200,.4);
      background: rgba(13,8,11,.8);
    }
    .btn:active {
      transform: scale(.95);
    }
    .btn.danger {
      background: rgba(100,30,42,.3);
      border-color: var(--wine2);
      color: var(--silver2);
    }
    .btn.danger:hover {
      background: rgba(100,30,42,.6);
      border-color: var(--wine);
    }
    .btn.small {
      padding: 4px 12px;
      font-size: 10px;
      border-radius: 8px;
    }
    .btn.wine {
      background: var(--wine2);
      border-color: var(--wine2);
      color: var(--silver);
    }
    .btn.wine:hover {
      background: var(--wine);
      border-color: var(--wine);
    }
    .btn.wine:active {
      transform: scale(.95);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .icon-btn:hover {
      border-color: rgba(201,199,200,.4);
      background: rgba(13,8,11,.8);
    }
    .icon-btn:active {
      transform: scale(.92);
    }
    .admin-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(201,199,200,.15);
      background: rgba(13,8,11,.5);
      color: var(--silver2);
      font-size: 11px;
      font-family: Arial,
                   sans-serif;
      transition: all .2s ease;
    }
    .admin-btn:hover {
      background: rgba(13,8,11,.8);
      border-color: rgba(201,199,200,.3);
      transform: translateY(-1px);
    }
    .admin-btn:active {
      transform: scale(.94);
    }
    .admin-btn.wine {
      background: rgba(100,30,42,.3);
      border-color: var(--wine2);
      color: var(--silver2);
    }
    .admin-btn.wine:hover {
      background: rgba(100,30,42,.6);
      border-color: var(--wine);
    }
    .admin-btn.danger {
      background: rgba(100,30,42,.2);
      border-color: rgba(100,30,42,.5);
      color: var(--muted);
    }
    .admin-btn.danger:hover {
      background: rgba(100,30,42,.5);
      border-color: var(--wine2);
      color: var(--silver2);
    }
    .admin-btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .admin-btn-group .admin-btn {
      font-size: 10px;
      padding: 4px 10px;
    }
    .admin-input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid rgba(201,199,200,.17);
      background: rgba(12,7,10,.70);
      color: var(--silver);
      font-size: 14px;
      font-family: Arial,
                   sans-serif;
      transition: border .2s ease;
    }
    .admin-input:focus {
      outline: none;
      border-color: var(--wine2);
      box-shadow: 0 0 0 3px rgba(100,30,42,.15);
    }
    .admin-box {
      background: rgba(13,8,11,.8);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(201,199,200,.06);
    }
    .admin-item:hover {
      background: rgba(13,8,11,.4);
    }
    .admin-item-title {
      color: var(--silver2);
      font-size: 14px;
    }
    .admin-item-sub {
      color: var(--muted);
      font-size: 12px;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .admin-grid .btn {
      padding: 8px 6px;
      font-size: 10px;
    }
    .admin-grid .btn.active {
      background: linear-gradient(135deg,var(--wine2),var(--wine-dark));
      border-color: var(--wine2);
      color: var(--silver2);
      box-shadow: 0 0 0 1px rgba(201,199,200,.12), 0 4px 14px rgba(100,30,42,.22);
    }
    .admin-grid .btn.active:active, .admin-btn:active, .btn:active {
      background: var(--wine2);
      border-color: var(--silver2);
      color: #fff;
      transform: scale(.96);
    }
    .search-wrap {
      margin: 5px 0 20px;
      position: relative;
    }
    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 15px;
      border: 1px solid rgba(201,199,200,.17);
      background: rgba(12,7,10,.70);
      outline: none;
      color: var(--silver);
      font-family: Arial,
                   sans-serif;
    }
    .search::placeholder {
      color: var(--silver-dark);
    }
    .search:focus {
      border-color: rgba(132,48,62,.7);
      box-shadow: 0 0 0 3px rgba(100,30,42,.12);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 24px 0 13px;
      font-size: 24px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--silver2);
      font-weight: 500;
    }
    .section-title:before {
      content: "";
      width: 4px;
      height: 27px;
      background: var(--wine2);
      border-radius: 3px;
      box-shadow: 0 0 14px rgba(132,48,62,.35);
    }
    .welcome,
    .quote-card,
    .announcement,
    .stats,
    .empty {
      background: linear-gradient(
        145deg,
        rgba(48,27,34,.9),
        rgba(25,14,19,.94)
      );
      border: 1px solid rgba(201,199,200,.14);
      border-radius: 18px;
      padding: 17px;
      box-shadow: 0 14px 35px rgba(0,0,0,.2);
    }
    .welcome {
      font-size: 17px;
      line-height: 1.55;
      color: var(--silver2);
    }
    .quote-card {
      margin-top: 12px;
      position: relative;
      overflow: hidden;
    }
    .quote-card:before {
      content: "“";
      position: absolute;
      right: 10px;
      top: -28px;
      font-size: 100px;
      color: rgba(132,48,62,.18);
    }
    .quote-text {
      font-style: italic;
      line-height: 1.65;
      color: var(--silver2);
      position: relative;
    }
    .quote-source {
      margin-top: 8px;
      font: 11px Arial,
           sans-serif;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .action-row {
      display: flex;
      gap: 9px;
      margin: 14px 0;
      flex-wrap: wrap;
    }
    .action-row .btn {
      flex: 1;
      min-width: 145px;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .book-card {
      background: linear-gradient(
        145deg,
        rgba(48,27,34,.96),
        rgba(25,14,19,.97)
      );
      border: 1px solid rgba(201,199,200,.17);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 14px 38px rgba(0,0,0,.28);
      overflow: hidden;
      cursor: pointer;
      transition: .2s ease;
    }
    .book-card:hover {
      transform: translateY(-2px);
      border-color: rgba(201,199,200,.28);
    }
    .cover {
      aspect-ratio: 2/2.75;
      border-radius: 13px;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(132,48,62,.42),
          transparent 48%
        ),
        linear-gradient(
          145deg,
          #24131a,
          #0e080b
        );
      border: 1px solid rgba(201,199,200,.28);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .cover:after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201,199,200,.18);
      border-radius: 9px;
      pointer-events: none;
    }
    .cover-emoji {
      font-size: 58px;
      filter: grayscale(.55);
      opacity: .8;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 13px;
    }
    .book-title {
      font-size: 17px;
      line-height: 1.18;
      color: var(--silver);
      margin-bottom: 5px;
    }
    .author {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .rating-line {
      font: 12px Arial,
           sans-serif;
      color: var(--silver2);
    }
    .series-link {
      display: block;
      color: #b9aeb1;
      font: 11px Arial,
           sans-serif;
      margin-top: 8px;
      text-decoration: underline;
      text-decoration-color: rgba(132,48,62,.5);
    }
    .tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 7px;
      scrollbar-width: none;
    }
    .tags::-webkit-scrollbar {
      display: none;
    }
    .tag {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(100,30,42,.08);
      border: 1px solid rgba(132,48,62,.45);
      color: var(--muted);
      font: 11px Arial,
           sans-serif;
      cursor: pointer;
    }
    .tag.active {
      background: rgba(100,30,42,.45);
      color: var(--silver);
    }
    .catalog-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      align-items: center;
    }
    .seg {
      display: flex;
      background: rgba(13,8,11,.55);
      padding: 4px;
      border-radius: 13px;
      border: 1px solid rgba(201,199,200,.12);
      margin: 12px 0;
    }
    .seg button {
      flex: 1;
      padding: 9px 7px;
      border: 0;
      background: transparent;
      font: 11px Arial,
           sans-serif;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .seg button.active {
      background: var(--wine2);
      border-radius: 9px;
    }
    .sort select {
      width: 100%;
      color: var(--silver2);
      outline: none;
      font: 12px Arial,
           sans-serif;
    }
    .horizontal-book {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 12px;
      padding: 12px;
      margin-bottom: 9px;
    }
    .horizontal-book .cover {
      width: 86px;
      height: 118px;
      margin: 0;
    }
    .horizontal-book .cover-emoji {
      font-size: 34px;
    }
    .h-info {
      min-width: 0;
    }
    .h-info .book-title {
      font-size: 18px;
    }
    .h-bottom {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .heart {
      background: none;
      border: 0;
      font-size: 23px;
      color: var(--silver-dark);
      cursor: pointer;
      padding: 3px;
      transition: all .2s ease;
    }
    .heart:active {
      transform: scale(.85);
    }
    .heart.active {
      color: var(--wine2);
    }
    .series-card {
      padding: 16px;
      margin-bottom: 10px;
    }
    .series-name {
      font-size: 20px;
      color: var(--silver);
      margin-bottom: 10px;
    }
    .series-count {
      font: 11px Arial,
           sans-serif;
      color: var(--muted);
    }
    .series-book {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(201,199,200,.1);
      cursor: pointer;
      color: var(--silver2);
    }
    .series-order {
      color: var(--silver-dark);
      font: 12px Arial,
           sans-serif;
    }
    .announcement {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .announcement .cover {
      width: 78px;
      height: 108px;
      flex: 0 0 auto;
      margin: 0;
    }
    .teaser {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .countdown {
      font: 12px Arial,
           sans-serif;
      color: var(--silver2);
      margin-top: 7px;
    }
    .stats {
      margin-bottom: 13px;
    }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }
    .stat strong {
      display: block;
      font-size: 22px;
      color: var(--silver);
    }
    .stat span {
      font: 10px Arial,
           sans-serif;
      color: var(--muted);
      text-transform: uppercase;
    }
    .progress {
      height: 8px;
      background: rgba(13,8,11,.8);
      border-radius: 99px;
      overflow: hidden;
      margin: 13px 0 5px;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--wine-dark),
        var(--wine2)
      );
      width: 0;
      transition: width .5s;
    }
    .status-group {
      margin-bottom: 20px;
    }
    .status-title {
      font-size: 18px;
      color: var(--silver2);
      margin: 12px 0;
    }
    .status-buttons {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }
    .status-buttons button {
      flex: 1;
      padding: 7px;
      border-radius: 9px;
      border: 1px solid rgba(201,199,200,.14);
      background: rgba(13,8,11,.5);
      font: 10px Arial,
           sans-serif;
      color: var(--muted);
    }
    .status-buttons button.active {
      background: rgba(132,48,62,.45);
      color: var(--silver);
      border-color: var(--wine2);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 20px;
    }
    .hidden {
      display: none !important;
    }
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 30px;
      font: 13px Arial,
           sans-serif;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(92px + var(--safe));
      transform: translateX(-50%) translateY(15px);
      opacity: 0;
      pointer-events: none;
      background: #211117;
      border: 1px solid rgba(201,199,200,.2);
      padding: 10px 15px;
      border-radius: 12px;
      font: 12px Arial,
           sans-serif;
      z-index: 1000;
      transition: .25s;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-box {
      width: min(900px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: linear-gradient(
        150deg,
        #24131a,
        #10090d
      );
      border: 1px solid rgba(201,199,200,.18);
      border-radius: 22px 22px 0 0;
      padding: 17px 15px calc(28px + var(--safe));
      box-shadow: 0 -20px 70px rgba(0,0,0,.55);
      animation: up .22s ease;
    }
    @keyframes up {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: none;
        opacity: 1;
      }
    }
    .modal-head {
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }
    .modal-cover {
      width: 105px;
      height: 145px;
      flex: 0 0 auto;
    }
    .modal-meta {
      flex: 1;
    }
    .modal-title {
      font-size: 25px;
      line-height: 1.1;
      color: var(--silver);
    }
    .close {
      float: right;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 28px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .close:hover {
      color: var(--silver2);
      transform: rotate(90deg);
    }
    .close:active {
      transform: scale(.85);
    }
    .modal-tabs {
      display: flex;
      gap: 5px;
      margin: 16px 0 12px;
      overflow: auto;
    }
    .modal-tabs button {
      flex: 1;
      min-width: 105px;
      border: 1px solid rgba(201,199,200,.13);
      background: rgba(13,8,11,.5);
      padding: 10px;
      border-radius: 10px;
      font: 11px Arial,
           sans-serif;
      transition: all .2s ease;
    }
    .modal-tabs button.active {
      background: rgba(100,30,42,.55);
      border-color: var(--wine2);
      color: var(--silver);
    }
    .modal-tabs button:hover {
      border-color: rgba(201,199,200,.3);
    }
    .modal-tabs button:active {
      transform: scale(.95);
    }
    .annotation {
      font-size: 15px;
      line-height: 1.75;
      color: var(--silver2);
    }
    .annotation:first-letter {
      font-size: 38px;
      color: var(--wine2);
      float: left;
      line-height: .8;
      padding-right: 5px;
    }
    .trigger-list {
      margin: 10px 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.7;
    }
    .star-rating {
      display: flex;
      gap: 3px;
      margin: 9px 0;
    }
    .star {
      border: 0;
      background: none;
      padding: 2px;
      font-size: 24px;
      color: var(--silver-dark);
      cursor: pointer;
      transition: all .15s ease;
    }
    .star:active {
      transform: scale(.8);
    }
    .star.active {
      color: #c9c7c8;
    }
    .track {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 11px;
      border-bottom: 1px solid rgba(201,199,200,.08);
      cursor: pointer;
      transition: all .2s ease;
    }
    .track:hover {
      background: rgba(100,30,42,.15);
    }
    .track:active {
      transform: scale(.98);
    }
    .track.active {
      background: rgba(100,30,42,.2);
    }
    .track-play {
      font-size: 18px;
      width: 28px;
    }
    .track-info strong {
      display: block;
      color: var(--silver2);

  <script>
    "use strict";
    const SHEETS = 
      "https://opensheet.elk.sh/1-sr4yfsUXDc4m_5jl1ugVy3XLH4refVGwV2RTSDKUg8"
    
    const STATS_API =
      "https://script.google.com/macros/s/AKfycbxaoCpUy7QfLCC1yb5FU1P_1YU_p8z3V-5P9QQaS0ekBYdebL3elMBnxaPs9edEYvs7yQ/exec";
    const CACHE_KEY = "midnightbooks_cache_v3";
    const ADMIN_PASSWORD = "midnight2026";

    const state = {
      page: "home",
      catalogMode: "books",
      search: "",
      sort: "date",
      trope: "all",
      books: [],
      playlists: [],
      files: [],
      covers: [],
      announcements: [],
      stats: {},
      statisticsEnabled: false,
      userRatings: {},
      currentBook: null,
      modalTab: "description",
      seriesView: null,
      player: {
        audio: null,
        tracks: [],
        index: 0,
        playing: false
      }
    };
    // =========================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // =========================
    function tg() {
      return window.Telegram &&
             Telegram.WebApp
             ? Telegram.WebApp
             : null;
    }
    function h(s) {
      return String(s ?? "")
        .replace(
          /[&<>"']/g,
          m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[m]
        );
    }
    function arr(v) {
      if (Array.isArray(v)) {
        return v;
      }
      if (v == null || v === "") {
        return [];
      }
      return String(v)
        .split(/\s*[|;,]\s*/)
        .filter(Boolean);
    }
    function num(v, f = 0) {
      const n = parseFloat(
        String(v ?? "")
          .replace(",", ".")
      );
      return Number.isFinite(n)
             ? n
             : f;
    }
    function escUrl(url) {
      try {
        return new URL(
          String(url).trim(),
          window.location.href
        ).href;
      } catch {
        return "";
      }
    }
    function normalizeId(v) {
      return String(v ?? "")
        .trim()
        .replace(/^0+(?=\d)/, "");
    }
    function storageGet(k, f) {
      try {
        const v = localStorage.getItem(k);
        return v === null
               ? f
               : JSON.parse(v);
      } catch {
        return f;
      }
    }
    function storageSet(k, v) {
      try {
        localStorage.setItem(
          k,
          JSON.stringify(v)
        );
      } catch {}
    }
    function toast(t) {
      const el = document.getElementById("toast");
      el.textContent = t;
      el.classList.add("show");
      clearTimeout(window.__toast);
      window.__toast = setTimeout(
        () => el.classList.remove("show"),
        1800
      );
    }
    function getFavoriteIds() {
      return storageGet("favorites", [])
        .map(String);
    }
    function isFavorite(id) {
      return getFavoriteIds()
        .includes(String(id));
    }
    function getStatus(id) {
      return storageGet("book_status_" + id, "");
    }
    function telegramUserId() {
      try {
        const u = tg()?.initDataUnsafe?.user;
        if (u?.id) {
          return String(u.id);
        }
      } catch {}
      let id = storageGet(
        "midnightbooks_guest_id",
        ""
      );
      if (!id) {
        id = "guest_" +
             Math.random()
               .toString(36)
               .slice(2) +
             "_" +
             Date.now();
        storageSet("midnightbooks_guest_id", id);
      }
      return id;
    }
    function formatDate(s) {
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) {
        return s || "";
      }
      return d.toLocaleDateString(
        "ru-RU", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );
    }
    function plural(n, a, b, c) {
      return n % 10 === 1 &&
             n % 100 !== 11
             ? a
             : n % 10 >= 2 &&
               n % 10 <= 4 &&
               (n % 100 < 10 ||
                n % 100 >= 20)
               ? b
               : c;
    }
    function statsReady() {
      return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/
        .test(String(STATS_API || "").trim());
    }
    function zeroStats() {
      return {
        views: 0,
        downloads: 0,
        rating_sum: 0,
        rating_count: 0,
        rating: 0
      };
    }
    function getBookStats(id) {
      return state.stats[String(id)] || zeroStats();
    }
    function getViews(id) {
      return Number(getBookStats(id).views || 0);
    }
    function getDownloads(id) {
      return Number(getBookStats(id).downloads || 0);
    }
    function getRatingCount(id) {
      return Number(getBookStats(id).rating_count || 0);
    }
    function getBookRating(b) {
      return Number(getBookStats(b.id).rating || 0);
    }
    function getUserRating(id) {
      return Number(state.userRatings[String(id)] || 0);
    }
    // =========================
    // НОРМАЛИЗАЦИЯ
    // =========================
    function normalizeCoverUrl(value) {
      let raw = String(value ?? "").trim();
      if (!raw) {
        return "";
      }
      const imageFormula = raw.match(
        /=IMAGE\s*\(\s*["']([^"']+)["']/i
      );
      if (imageFormula) {
        raw = imageFormula[1];
      }
      const href = raw.match(
        /href\s*=\s*["']([^"']+)["']/i
      );
      if (href) {
        raw = href[1];
      }
      const urlMatch = raw.match(
        /https?:\/\/[^\s<>"']+/i
      );
      if (urlMatch) {
        raw = urlMatch[0];
      }
      raw = raw.replace(/[),.;]+$/g, "");
      let github = raw.match(
        /^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i
      );
      if (github) {
        const owner = github[1];
        const repo = github[2];
        const branch = github[3];
        const filePath = github[4]
          .split('#')[0]
          .split('?')[0];
        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
      }
      let githubRaw = raw.match(
        /^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/i
      );
      if (githubRaw) {
        return raw;
      }
      let m = raw.match(
        /drive\.google\.com\/file\/d\/([^/]+)/i
      );
      if (m) {
        return `https://drive.google.com/thumbnail?id=${encodeURIComponent(m[1])}&sz=w1000`;
      }
      m = raw.match(
        /drive\.google\.com\/(?:open\?id=|uc\?(?:export=download&)?id=)([^&]+)/i
      );
      if (m) {
        return `https://drive.google.com/thumbnail?id=${encodeURIComponent(m[1])}&sz=w1000`;
      }
      return escUrl(raw);
    }
    function normalizeFileUrl(value) {
      let raw = String(value ?? "").trim();
      if (!raw) {
        return "";
      }
      const href = raw.match(
        /href\s*=\s*["']([^"']+)["']/i
      );
      if (href) {
        raw = href[1];
      }
      const urlMatch = raw.match(
        /https?:\/\/[^\s<>"']+/i
      );
      if (urlMatch) {
        raw = urlMatch[0];
      }
      raw = raw.replace(/[),.;]+$/g, "");
      const github = raw.match(
        /^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i
      );
      if (github) {
        const owner = github[1];
        const repo = github[2];
        const branch = github[3];
        const filePath = github[4]
          .split('#')[0]
          .split('?')[0];
        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
      }
      return escUrl(raw);
    }
    function normalizeBook(b, i) {
      return {
        ...b,
        id: normalizeId(b.id ?? i + 1),
        title: String(b.title ?? "Без названия"),
        author: String(b.author ?? "Неизвестный автор"),
        series: String(b.series ?? ""),
        series_order: String(b.series_order ?? ""),
        trops: typeof b.trops === "string"
                ? b.trops
                    .split(",")
                    .map(t => t.trim())
                    .filter(Boolean)
                : (b.trops || []),
        triggers: typeof b.triggers === "string"
                  ? b.triggers
                      .split(",")
                      .map(t => t.trim())
                      .filter(Boolean)
                  : (b.triggers || []),
        quotes: typeof b.quotes === "string"
                ? b.quotes
                    .split("|")
                    .map(q => q.trim())
                    .filter(Boolean)
                : (b.quotes || []),
        description: String(
          b.description ?? "Описание пока не добавлено."
        ),
        cover_emoji: String(
          b.cover_emoji ?? ["🌹", "🗡️", "🎭", "🌿"][i % 4]
        ),
        cover_url: String(b.cover_url ?? b.cover ?? ""),
        rating: 0,
        release_date: String(b.release_date ?? ""),
        status: String(b.status ?? "published")
      };
    }
    // =========================
    // ЗАГРУЗКА ДАННЫХ
    // =========================
    async function fetchJSON(url) {
      if (!url) {
        throw new Error("missing URL");
      }
      const join = String(url).includes("?") ? "&" : "?";
      const finalUrl = String(url) + join + "t=" + Date.now();
      const r = await fetch(finalUrl, {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache" }
      });
      if (!r.ok) {
        throw new Error("HTTP " + r.status);
      }
      return await r.json();
    }
    function unwrap(data) {
      if (Array.isArray(data)) {
        return data;
      }
      if (data && Array.isArray(data.data)) {
        return data.data;
      }
      if (data && Array.isArray(data.rows)) {
        return data.rows;
      }
      if (data && Array.isArray(data.values)) {
        return data.values;
      }
      if (data && typeof data === "object") {
        const keys = Object.keys(data);
        for (const k of keys) {
          if (Array.isArray(data[k])) {
            return data[k];
          }
        }
      }
      return [];
    }
    function getCoverLink(row) {
      if (!row || typeof row !== "object") {
        return "";
      }
      const preferred = [
        row.cover_url,
        row.coverUrl,
        row.cover,
        row.url,
        row.image_url,
        row.imageUrl,
        row.thumbnail_url,
        row.thumbnailUrl,
        row.link,
        row.href,
        row.ссылка,
        row.обложка
      ];
      for (const v of preferred) {
        const url = normalizeCoverUrl(v);
        if (url) {
          return url;
        }
      }
      for (const v of Object.values(row)) {
        const url = normalizeCoverUrl(v);
        if (url) {
          return url;
        }
      }
      return "";
    }
    function mergeCoversIntoBooks() {
      const coverMap = new Map();
      state.covers.forEach(c => {
        const id = normalizeId(
          c.book_id ??
          c.bookId ??
          c.book ??
          c.id
        );
        if (!id) {
          return;
        }
        const url = getCoverLink(c);
        if (url) {
          coverMap.set(id, url);
        }
      });
      state.books = state.books.map(book => ({
        ...book,
        cover_url: coverMap.get(normalizeId(book.id)) || ""
      }));
    }
    function applyData(data) {
      state.books = unwrap(data.books || [])
        .map(normalizeBook);
      state.playlists = unwrap(data.playlists || []);
      state.files = unwrap(data.files || []);
      state.covers = unwrap(data.covers || []);
      state.announcements = unwrap(data.announcements || []);
      mergeCoversIntoBooks();
    }
    function getCover(book) {
      if (!book) {
        return null;
      }
      const bookId = normalizeId(book.id);
      if (book.cover_url) {
        return {
          cover_url: book.cover_url
        };
      }
      const row = state.covers.find(
        c => normalizeId(
          c.book_id ??
          c.bookId ??
          c.book ??
          c.id
        ) === bookId
      );
      const url = getCoverLink(row);
      return url
             ? {
               cover_url: url
             }
             : null;
    }
    function coverHTML(book, cls = "cover") {
      const c = getCover(book);
      const imageUrl = normalizeCoverUrl(
        c?.cover_url ||
        c?.thumbnail_url ||
        ""
      );
      if (imageUrl) {
        return `<div class="${cls}">
          <img
            src="${h(imageUrl)}"
            alt="${h(book.title || "Обложка")}"
            loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.onerror=null;
                     this.src='';
                     this.style.display='none';
                     this.nextElementSibling.classList.remove('hidden')"
          >
          <span class="cover-fallback cover-emoji hidden">
            ${h(book.cover_emoji || "📖")}
          </span>
        </div>`;
      }
      return `<div class="${cls}">
        <span class="cover-emoji">
          ${h(book.cover_emoji || "📖")}
        </span>
      </div>`;
    }
    function tracksFor(bookId) {
      return state.playlists
        .filter(x =>
          String(x.book_id ?? x.bookId) ===
          String(bookId)
        )
        .map(x => ({
          name: String(
            x.track_name ??
            x.name ??
            "Без названия"
          ),
          artist: String(x.artist ?? "—"),
          url: String(x.file_url ?? x.url ?? "")
        }));
    }
    function fileFor(bookId) {
      return state.files.find(
        x => String(x.book_id ?? x.bookId) ===
             String(bookId)
      );
    }
    async function fetchRemote(silent = false) {
      if (!silent) {
        showLoading();
      }

      // КНИГИ — обязательный лист. Дополнительные листы не должны
      // ломать всю библиотеку, если один из них отсутствует или ещё
      // не опубликован.
      const keys = [
        "books",
        "playlists",
        "files",
        "covers",
        "announcements"
      ];

      const results = await Promise.all(
        keys.map(async k => {
          try {
            return unwrap(await fetchJSON(SHEETS[k]));
          } catch (e) {
            console.warn("Не удалось загрузить лист:", k, e);
            return [];
          }
        })
      );

      const data = {
        books: results[0],
        playlists: results[1],
        files: results[2],
        covers: results[3],
        announcements: results[4]
      };

      if (!data.books.length) {
        throw new Error("Не удалось получить данные листа КНИГИ");
      }

      applyData(data);
      storageSet(CACHE_KEY, {
        books: state.books,
        playlists: state.playlists,
        files: state.files,
        covers: state.covers,
        announcements: state.announcements,
        updatedAt: Date.now()
      });
      render();
      if (!silent) {
        toast("Библиотека обновлена");
      }
    }
    function showLoading() {
      document.getElementById("main").innerHTML =
        '<div class="loading">Загружаем библиотеку…</div>';
    }
    async function loadData(force = false) {
      const cached = storageGet(CACHE_KEY, null);
      if (force) {
        await fetchRemote(false);
        await loadStats();
        return;
      }
      try {
        await fetchRemote(true);
        await loadStats();
      } catch {
        if (cached && cached.books?.length) {
          applyData(cached);
          render();
          toast("Показан сохранённый кэш");
        } else {
          state.books = [];
          state.playlists = [];
          state.files = [];
          state.covers = [];
          state.announcements = [];
          render();
          toast("В таблице КНИГИ пока нет данных");

    function applyStatsPayload(data) {
      state.statisticsEnabled = !!data?.enabled;
      const incoming = data?.stats || {};
      state.stats = {};
      state.books.forEach(b => {
        state.stats[String(b.id)] =
          incoming[String(b.id)] ||
          zeroStats();
      });
      state.userRatings = data?.my_ratings || {};
    }
    function statsRequest(action, bookId = "", rating = 0) {
      if (!statsReady()) {
        return Promise.resolve({
          ok: true,
          enabled: false,
          stats: {},
          my_ratings: {}
        });
      }
      return new Promise((resolve, reject) => {
        const cb =
          "mbStatsCb_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("stats timeout"));
        }, 15000);

        function cleanup() {
          clearTimeout(timer);
          try {
            delete window[cb];
          } catch {}
          script.remove();
        }
        window[cb] = (data) => {
          cleanup();
          applyStatsPayload(data);
          resolve(data);
        };
        const q = new URLSearchParams({
          callback: cb,
          action: String(action),
          book_id: String(bookId || ""),
          rating: String(rating || 0),
          user_id: telegramUserId(),
          t: String(Date.now())
        });
        script.src = STATS_API + "?" + q.toString();
        script.onerror = () => {
          cleanup();
          reject(new Error("stats network error"));
        };
        document.head.appendChild(script);
      });
    }
    async function loadStats() {
      if (!statsReady()) {
        state.statisticsEnabled = false;
        state.stats = {};
        state.userRatings = {};
        state.books.forEach(b => {
          state.stats[String(b.id)] = zeroStats();
        });
        render();
        return;
      }
      try {
        await statsRequest("stats");
        render();
      } catch {
        state.statisticsEnabled = false;
        state.stats = {};
        state.userRatings = {};
        state.books.forEach(b => {
          state.stats[String(b.id)] = zeroStats();
        });
      }
    }

    function quoteOfDay() {
      const books = state.books.filter(b => {
        const q = Array.isArray(b.quotes) ? b.quotes : arr(b.quotes);
        return q.length > 0;
      });
      if (!books.length) {
        return { text: "Цитаты пока не добавлены.", source: "MidnightBooks" };
      }
      const d = new Date();
      const key = d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
      let hash = 0;
      for (const c of key) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
      const b = books[hash % books.length];
      const qArr = Array.isArray(b.quotes) ? b.quotes : arr(b.quotes);
      return { text: qArr[hash % qArr.length], source: b.title };
    }

    async function downloadBook(book) {
      const f = fileFor(book.id);
      const source = f?.file_url ?? f?.fileUrl ?? f?.url ?? "";
      if (!source) {
        toast("EPUB ещё не добавлен");
        return;
      }
      const url = normalizeFileUrl(source);
      if (!url) {
        toast("Некорректная ссылка EPUB");
        return;
      }
      const filename =
        (String(source).match(/\/([^/?#]+?)(?:\?.*)?$/)?.[1] ||
         `${book.title || "book"}.epub`)
        .replace(/%20/g, " ");
      try {
        const response = await fetch(url, {
          mode: "cors",
          cache: "no-store"
        });
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = decodeURIComponent(filename);
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        if (state.statisticsEnabled) {
          try {
            await statsRequest("download", book.id);
            render();
            if (state.currentBook?.id === book.id) {
              showBookModal();
            }
          } catch {}
        }
        toast("EPUB скачивается");
        return;
      } catch (e) {
        const t = tg();
        try {
          if (t?.openLink) {
            t.openLink(url);
          } else {
            window.open(url, "_blank");
          }
        } catch {
          window.open(url, "_blank");
        }
      }
    }

    function playTracks(tracks, index = 0) {
      if (!tracks.length) {
        return;
      }
      state.player.tracks = tracks;
      state.player.index = index;
      if (state.player.audio) {
        state.player.audio.pause();
        state.player.audio = null;
      }
      const track = tracks[index];
      if (!track.url) {
        toast("У этого трека нет аудиофайла");
        updatePlayer();
        return;
      }
      const a = new Audio(track.url);
      a.preload = "metadata";
      a.loop = false;
      a.addEventListener("ended", () => nextTrack());
      a.addEventListener("timeupdate", updatePlayer);
      a.addEventListener("loadedmetadata", updatePlayer);
      state.player.audio = a;
      state.player.playing = true;
      a.play().catch(() => {
        state.player.playing = false;
        toast("Нажмите ▶ для запуска аудио");
      });
      updatePlayer();
    }
    function nextTrack() {
      const p = state.player;
      if (!p.tracks.length) {
        return;
      }
      p.index = (p.index + 1) % p.tracks.length;
      playTracks(p.tracks, p.index);
    }
    function prevTrack() {
      const p = state.player;
      if (!p.tracks.length) {
        return;
      }
      if (p.audio && p.audio.currentTime > 4) {
        p.audio.currentTime = 0;
        return;
      }
      p.index = (p.index - 1 + p.tracks.length) %
                p.tracks.length;
      playTracks(p.tracks, p.index);
    }
    function updatePlayer() {
      const p = state.player;
      const el = document.getElementById("player");
      if (!p.tracks.length) {
        el.classList.add("hidden");
        return;
      }
      el.classList.remove("hidden");
      const t = p.tracks[p.index] || {};
      document.getElementById("playerTitle").textContent =
        t.name || "Нет трека";
      document.getElementById("playerArtist").textContent =
        t.artist || "—";
      document.getElementById("playPause").textContent =
        p.playing ? "⏸" : "▶";
      const a = p.audio;
      const d = a?.duration || 0;
      const c = a?.currentTime || 0;
      document.querySelector("#playerProgress i")
        .style.width = d ? `${c / d * 100}%` : "0%";
      document.getElementById("playerTime").textContent =
        `${fmtTime(c)} / ${fmtTime(d)}`;
    }
    function fmtTime(s) {
      if (!Number.isFinite(s)) {
        return "0:00";
      }
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    }
    document.getElementById("playPause").onclick =
      () => {
        const a = state.player.audio;
        if (!a) {
          if (state.player.tracks.length) {
            playTracks(
              state.player.tracks,
              state.player.index
            );
          }
          return;
        }
        if (a.paused) {
          a.play()
            .then(() => {
              state.player.playing = true;
              updatePlayer();
            })
            .catch(() => {});
        } else {
          a.pause();
          state.player.playing = false;
          updatePlayer();
        }
      };
    document.getElementById("nextTrack").onclick =

    function apiReady() {
      return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(String(STATS_API || '').trim());

    function apiPost(payload, timeoutMs = 60000) {
      return new Promise((resolve, reject) => {
        if (!apiReady()) return reject(new Error('Не настроен URL Apps Script'));
        const iframeName = 'mbApiFrame_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = STATS_API;
        form.target = iframeName;
        form.enctype = 'application/x-www-form-urlencoded';
        form.style.display = 'none';
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = 'data'; input.value = JSON.stringify(payload);
        form.appendChild(input); document.body.appendChild(form);
        let finished = false;
        const finish = (ok, error) => {
          if (finished) return;
          finished = true; clearTimeout(timer);
          try { form.remove(); } catch {}
          try { iframe.remove(); } catch {}
          ok ? resolve({ok:true}) : reject(new Error(error || 'Apps Script не подтвердил сохранение'));
        };
        const timer = setTimeout(() => finish(true), timeoutMs);
        try { form.submit(); } catch (e) { finish(false, e.message || 'Не удалось отправить данные'); }
      });
    }

          await fetchRemote(true);
          if (!checkFn || checkFn()) return true;

    function fileToBase64(input, maxMB = 20) {
      const file = input?.files?.[0];
      if (!file) return Promise.resolve(null);
      if (file.size > maxMB * 1024 * 1024) throw new Error(`Файл слишком большой. Максимум ${maxMB} МБ.`);
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({file, base64:String(reader.result).split(',')[1] || ''});
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.readAsDataURL(file);
      });
    }

    async function uploadBookAsset(bookId, inputId, type) {
      const x = await fileToBase64(document.getElementById(inputId));
      if (!x) return null;
      if (type === 'epub' && !x.file.name.toLowerCase().endsWith('.epub')) throw new Error('Можно загружать только EPUB.');
      return apiPost({
        action: type === 'cover' ? 'upload_cover' : 'upload_epub',
        book_id: normalizeAdminId(bookId),
        file_name: x.file.name,
        mime_type: x.file.type || (type === 'epub' ? 'application/epub+zip' : 'image/jpeg'),
        file_base64: x.base64,
        asset_type: type
      }, 90000);
    }

    async function uploadAudio(bookId, inputId) {
      const x = await fileToBase64(document.getElementById(inputId));
      if (!x) return null;
      if (!/^audio\//.test(x.file.type) && !/\.(mp3|m4a|ogg|wav)$/i.test(x.file.name)) throw new Error('Выберите аудиофайл MP3, M4A, OGG или WAV.');
      return apiPost({action:'upload_audio', book_id:normalizeAdminId(bookId), file_name:x.file.name, mime_type:x.file.type || 'audio/mpeg', file_base64:x.base64}, 90000);
    }

          <textarea id="${e}Description" class="admin-input" rows="5" placeholder="Аннотация">${val('description')}</textarea>
          <input type="text" id="${e}Series" class="admin-input" value="${val('series')}" placeholder="Серия">
          <input type="text" id="${e}SeriesOrder" class="admin-input" value="${val('series_order')}" placeholder="Номер в серии">
          <input type="date" id="${e}ReleaseDate" class="admin-input" value="${val('release_date')}" placeholder="Дата">
          <select id="${e}Status" class="admin-input">
            <option value="published" ${val('status') === 'published' ? 'selected' : ''}>Опубликована</option>
            <option value="active" ${val('status') === 'active' ? 'selected' : ''}>Активна</option>
            <option value="draft" ${val('status') === 'draft' ? 'selected' : ''}>Черновик</option>
          </select>
          <input type="text" id="${e}CoverEmoji" class="admin-input" value="${val('cover_emoji')}" placeholder="Эмодзи обложки">
          <input type="text" id="${e}CoverUrl" class="admin-input" value="${val('cover_url') || val('cover')}" placeholder="Или ссылка на обложку">
          <label style="color:var(--muted);font:11px Arial;display:block;margin-top:8px">🖼 Файл обложки — автоматически в Google Drive</label>
          <input type="file" id="${e}CoverFile" class="admin-input" accept="image/*">
          <label style="color:var(--muted);font:11px Arial;display:block;margin-top:8px">📖 EPUB — автоматически в Google Drive</label>
          <input type="file" id="${e}Epub" class="admin-input" accept=".epub,application/epub+zip">
          <label style="color:var(--muted);font:11px Arial;display:block;margin-top:8px">💬 Цитаты — каждая с новой строки</label>
          <textarea id="${e}Quotes" class="admin-input" rows="5" placeholder="Цитата 1\nЦитата 2">${h((Array.isArray(book?.quotes) ? book.quotes : arr(book?.quotes)).join('\n'))}</textarea>
          <button class="btn primary" onclick="${book ? `saveEditBookFull(${JSON.stringify(String(book.id))})` : 'saveNewBookFull()'}" style="width:100%;margin-top:8px">💾 Сохранить всё</button>
          <button class="btn" onclick="adminTab('books')" style="width:100%;margin-top:5px">↩️ Назад</button>
        </div>`;
    }

    function showAddBookForm() { document.getElementById('adminTabContent').innerHTML = bookForm(); }
    function collectBookForm(prefix, id) {
      const g = x => document.getElementById(prefix + x);
      return {
        ...(id ? {id} : {}),
        title:g('Title').value.trim() || 'Без названия',
        author:g('Author').value.trim() || 'Неизвестный автор',
        trops:g('Trops').value.split(',').map(x=>x.trim()).filter(Boolean),
        triggers:g('Triggers').value.split(',').map(x=>x.trim()).filter(Boolean),
        description:g('Description').value.trim() || 'Описание пока не добавлено.',
        series:g('Series').value.trim(),
        series_order:g('SeriesOrder').value.trim(),
        release_date:g('ReleaseDate').value,
        status:g('Status').value,
        cover_emoji:g('CoverEmoji').value.trim() || '📖',
        cover:g('CoverUrl').value.trim(),
        quotes:g('Quotes').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)
      };
    }

    async function saveNewBookFull() {
      try {
        const data = collectBookForm('new');
        const result = await apiPost({action:'add_book',book:data});
        const id = normalizeAdminId(result.id || data.id || ('book_' + Date.now()));
        // Если сервер сгенерировал ID, сразу обновляем запись корректным ID только если нужно.
        if (!result.id) throw new Error('Apps Script не вернул ID книги');
        toast('⏳ Проверяю книгу в Google Таблице…');
        if (!await refreshFromSheetsAfterWrite(() => state.books.some(b=>normalizeAdminId(b.id)===id))) throw new Error('Google Таблица не подтвердила книгу');
        if (document.getElementById('newCoverFile')?.files?.length) {
          toast('⏳ Загружаю обложку в Google Drive…');
          await uploadBookAsset(id,'newCoverFile','cover');
        }
        if (document.getElementById('newEpub')?.files?.length) {
          toast('⏳ Загружаю EPUB в Google Drive…');
          await uploadBookAsset(id,'newEpub','epub');
        }
        await refreshFromSheetsAfterWrite(() => state.books.some(b=>normalizeAdminId(b.id)===id), 6);
        toast('✅ Книга, данные и файлы сохранены');
        adminTab('books'); render();
      } catch(e) { toast('❌ ' + (e.message || 'Ошибка сохранения')); }
    }

    function editBook(id) {
      const book = state.books.find(b=>normalizeAdminId(b.id)===normalizeAdminId(id));
      if (!book) return;
      document.getElementById('adminTabContent').innerHTML = bookForm(book);
    }

    async function saveEditBookFull(id) {
      try {
        id = normalizeAdminId(id);
        const data = collectBookForm('edit', id);
        await apiPost({action:'update_book',book:data});
        toast('⏳ Проверяю изменения в Google Таблице…');
        if (!await refreshFromSheetsAfterWrite(() => {
          const b=state.books.find(x=>normalizeAdminId(x.id)===id);
          return !!b && b.title===data.title && b.author===data.author && b.description===data.description;
        })) throw new Error('Google Таблица не подтвердила изменения');
        if (document.getElementById('editCoverFile')?.files?.length) {
          toast('⏳ Загружаю новую обложку…');
          await uploadBookAsset(id,'editCoverFile','cover');
        }
        if (document.getElementById('editEpub')?.files?.length) {
          toast('⏳ Загружаю новый EPUB…');
          await uploadBookAsset(id,'editEpub','epub');
        }
        await refreshFromSheetsAfterWrite(() => state.books.some(b=>normalizeAdminId(b.id)===id), 6);
        toast('✅ Всё сохранено'); adminTab('books'); render();
      } catch(e) { toast('❌ ' + (e.message || 'Ошибка сохранения')); }
    }

    async function deleteBookAdmin(id) {
      id=normalizeAdminId(id);
      if (!id || !confirm('Удалить книгу из Google Таблицы? Файлы Drive не удаляются автоматически.')) return;
      try {
        await apiPost({action:'delete_book',book_id:id});
        if (!await refreshFromSheetsAfterWrite(() => !state.books.some(b=>normalizeAdminId(b.id)===id), 6)) throw new Error('Удаление не подтверждено таблицей');
        toast('🗑️ Книга удалена'); adminTab('books'); render();
      } catch(e){ toast('❌ '+(e.message||'Ошибка удаления')); }
    }

    function editQuotes(id) {
      const book=state.books.find(b=>normalizeAdminId(b.id)===normalizeAdminId(id)); if(!book)return;
      const q=Array.isArray(book.quotes)?book.quotes:arr(book.quotes);
      document.getElementById('adminTabContent').innerHTML=`
        <div class="admin-box">
          <h3 style="color:var(--silver2);margin-top:0">💬 Цитаты: ${h(book.title)}</h3>
          <textarea id="quotesAll" class="admin-input" rows="12" placeholder="Каждая цитата с новой строки">${h(q.join('\n'))}</textarea>
          <button class="btn primary" onclick="saveQuotesFull(${JSON.stringify(String(id))})" style="width:100%">💾 Сохранить цитаты</button>
          <button class="btn" onclick="adminTab('books')" style="width:100%;margin-top:5px">↩️ Назад</button>
        </div>`;
    }
    async function saveQuotesFull(id){
      const quotes=document.getElementById('quotesAll').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      try{
        await apiPost({action:'update_book',book:{id:normalizeAdminId(id),quotes}});
        if(!await refreshFromSheetsAfterWrite(()=>{const b=state.books.find(x=>normalizeAdminId(x.id)===normalizeAdminId(id));return JSON.stringify(Array.isArray(b?.quotes)?b.quotes:arr(b?.quotes))===JSON.stringify(quotes)})) throw new Error('Цитаты не подтверждены таблицей');
        toast(`✅ ${quotes.length} цитат сохранено`);adminTab('books');render();
      }catch(e){toast('❌ '+(e.message||'Ошибка'));}
    }

    // ---------- МУЗЫКА ----------
    function renderAdminPlaylists(container) {
      container.innerHTML=`
        <div class="admin-box">
          <h3 style="color:var(--silver2);margin-top:0">🎵 Музыка</h3>
          <select id="playlistBookSelect" class="admin-input"><option value="">Выберите книгу</option>${state.books.map(b=>`<option value="${h(b.id)}">${h(b.title)}</option>`).join('')}</select>
          <input type="text" id="trackName" class="admin-input" placeholder="Название трека">
          <input type="text" id="trackArtist" class="admin-input" placeholder="Исполнитель">
          <input type="text" id="trackMood" class="admin-input" placeholder="Настроение (необязательно)">
          <input type="text" id="trackUrl" class="admin-input" placeholder="Или ссылка на MP3">
          <label style="color:var(--muted);font:11px Arial">🎧 Или загрузить аудиофайл в Google Drive</label>
          <input type="file" id="trackFile" class="admin-input" accept="audio/*,.mp3,.m4a,.ogg,.wav">
          <button class="btn primary" onclick="saveTrackFull()" style="width:100%">💾 Сохранить трек</button>
        </div>
        <div id="playlistTracks"></div>`;
      document.getElementById('playlistBookSelect').onchange=e=>renderPlaylistTracks(e.target.value);
    }
    function renderPlaylistTracks(bookId){
      const c=document.getElementById('playlistTracks'); if(!c)return;
      const tracks=state.playlists.filter(p=>String(p.book_id??p.bookId)===String(bookId));
      c.innerHTML=tracks.length?tracks.map(t=>`<div class="admin-item"><div><div class="admin-item-title">${h(t.track_name||'Без названия')}</div><div class="admin-item-sub">${h(t.artist||'—')}</div></div><button class="admin-btn danger" onclick="removeTrackFromPlaylist(${JSON.stringify(String(t.id))})">🗑️</button></div>`).join(''):'<div class="empty">Треков пока нет.</div>';
    }
    async function saveTrackFull(){
      const bookId=document.getElementById('playlistBookSelect').value;if(!bookId){toast('Выберите книгу');return;}
      const trackName=document.getElementById('trackName').value.trim();if(!trackName){toast('Введите название трека');return;}
      try{
        let url=document.getElementById('trackUrl').value.trim();
        const file=document.getElementById('trackFile');
        if(file?.files?.length){toast('⏳ Загружаю музыку в Google Drive…');const r=await uploadAudio(bookId,'trackFile');url=r.file_url;}
        if(!url)throw new Error('Укажите ссылку или выберите аудиофайл');
        const track={id:'track_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),book_id:bookId,track_name:trackName,artist:document.getElementById('trackArtist').value.trim()||'—',file_url:url,mood:document.getElementById('trackMood').value.trim()};
        await apiPost({action:'add_playlist',playlist:track});
        if(!await refreshFromSheetsAfterWrite(()=>state.playlists.some(t=>normalizeAdminId(t.id)===track.id),6))throw new Error('Трек не подтверждён таблицей');
        toast('✅ Трек и файл сохранены');renderPlaylistTracks(bookId);render();
      }catch(e){toast('❌ '+(e.message||'Ошибка'));}
    }
    async function removeTrackFromPlaylist(id){
      if(!confirm('Удалить трек из таблицы?'))return;
      try{await apiPost({action:'delete_playlist',id:normalizeAdminId(id)});if(!await refreshFromSheetsAfterWrite(()=>!state.playlists.some(t=>normalizeAdminId(t.id)===normalizeAdminId(id)),6))throw new Error('Удаление не подтверждено');toast('🗑️ Трек удалён');renderAdminPlaylists(document.getElementById('adminTabContent'));}catch(e){toast('❌ '+(e.message||'Ошибка'));}
    }

    // ---------- АНОНС ----------
    function renderAdminAnnounce(container){
      const a=state.announcements[0]||{};
      container.innerHTML=`
        <div class="admin-box">
          <h3 style="color:var(--silver2);margin-top:0">📢 Анонс</h3>
          <input type="text" id="annTitle" class="admin-input" value="${h(a.title||'')}" placeholder="Название">
          <input type="text" id="annAuthor" class="admin-input" value="${h(a.author||'')}" placeholder="Автор">
          <textarea id="annTeaser" class="admin-input" rows="4" placeholder="Тизер">${h(a.teaser||'')}</textarea>
          <input type="date" id="annDate" class="admin-input" value="${h(a.release_date||'')}">
          <input type="text" id="annEmoji" class="admin-input" value="${h(a.cover_emoji||'🌙')}" placeholder="Эмодзи">
          <input type="file" id="annCoverFile" class="admin-input" accept="image/*">
          <button class="btn primary" onclick="saveAnnounceFull()" style="width:100%">💾 Сохранить анонс</button>
        </div>`;
    }
    async function saveAnnounceFull(){
      const id=normalizeAdminId(state.announcements[0]?.id||('announcement_'+Date.now()));
      const data={id,title:document.getElementById('annTitle').value.trim()||'Скоро',author:document.getElementById('annAuthor').value.trim(),teaser:document.getElementById('annTeaser').value.trim(),release_date:document.getElementById('annDate').value,active:'TRUE',cover_emoji:document.getElementById('annEmoji').value.trim()||'🌙'};
      try{
        await apiPost({action:'save_announcement',announcement:data});
        if(!await refreshFromSheetsAfterWrite(()=>state.announcements.some(a=>normalizeAdminId(a.id)===id),6))throw new Error('Анонс не подтверждён таблицей');
        const f=document.getElementById('annCoverFile');
        if(f?.files?.length){const x=await fileToBase64(f);toast('⏳ Загружаю изображение анонса…');await apiPost({action:'upload_announcement_file',announcement_id:id,file_name:x.file.name,mime_type:x.file.type||'image/jpeg',file_base64:x.base64},90000);}
        await refreshFromSheetsAfterWrite(()=>state.announcements.some(a=>normalizeAdminId(a.id)===id),6);
        toast('✅ Анонс и файл сохранены');renderAdminAnnounce(document.getElementById('adminTabContent'));render();
      }catch(e){toast('❌ '+(e.message||'Ошибка'));}
    }

    // ---------- СТАТИСТИКА ----------
    function renderAdminStats(container){
      container.innerHTML=`<div class="admin-box"><h3 style="color:var(--silver2);margin-top:0">📊 Статистика</h3>${state.books.map(b=>`<div class="admin-item"><div><div class="admin-item-title">${h(b.title)}</div><div class="admin-item-sub">👁 ${getViews(b.id)} · ⬇ ${getDownloads(b.id)} · ⭐ ${getBookRating(b).toFixed(1)} (${getRatingCount(b.id)})</div></div></div>`).join('')}</div>`;
    }
  </script>
</body>
</html>
